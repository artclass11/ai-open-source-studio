[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-repolens"
version = "0.1.0"
description = "Local repository auditing with Qwen3.5-4B"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "artclass11"}]
dependencies = [
  "accelerate>=1.6",
  "pillow>=11",
  "torch>=2.6",
  "transformers>=5.0,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
repolens = "qwen_repolens.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
